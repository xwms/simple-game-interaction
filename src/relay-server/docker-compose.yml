version: '3.8'

services:
  relay-server:
    build:
      context: ../..
      dockerfile: src/relay-server/Dockerfile
    restart: unless-stopped
    ports:
      - "9800:9800"
      # 管理端口仅绑定宿主机回环地址，公网不可达；远程运维请走 SSH 隧道
      - "127.0.0.1:9801:9801"
    environment:
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=9800
      - RELAY_ADMIN_HOST=0.0.0.0
      - RELAY_ADMIN_PORT=9801
      # 管理 API 令牌，为空时不鉴权；部署时请通过 .env 设置
      - RELAY_ADMIN_TOKEN=${RELAY_ADMIN_TOKEN:-}
      - RELAY_MAX_ROOMS=1000
      - RELAY_MAX_MEMBERS=8
      - RELAY_MAX_CLIENTS=5000
      - RELAY_MAX_PER_IP=10
      - RELAY_MSG_RATE=100
      - RELAY_LOG_LEVEL=info
      - NODE_ENV=production
    # Uncomment for TLS:
    #   - RELAY_TLS_CERT=/certs/fullchain.pem
    #   - RELAY_TLS_KEY=/certs/privkey.pem
    # volumes:
    #   - /etc/letsencrypt:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $$RELAY_ADMIN_TOKEN\" http://localhost:9801/health"]
      interval: 30s
      timeout: 5s
      retries: 3
